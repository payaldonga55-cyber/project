<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
    
</head>
<body>
     <a href="Arraymethods.html">methods</a>
<script>
     
        let i=1
        while(i<=10)
        {
            document.write("<br>",i)
            i++
        }
        let j=10
        do
        {
            document.write("<br>",j)
            j--
        }while(j>=1);
        
        
        for(let x=1;x<=5;x++)
        {
            for(let k=5;k>=x;k--)
           {
              document.write("&nbsp;&nbsp;")
           }
            for(let y=1;y<=x;y++)
            {
               document.write(y)
            }
           document.write("<br>")
        }
       let arr=[10,20,30]
       document.write(arr[0])
        for(m=0;m<arr.length;m++)
       {
           document.write("<br>arr[",m,"]=",arr[m])
       } 
       let arr2=[[10,25,34],[12,50,35],[10,20,23]]
       //document.write("<br>",arr2[0][0])
       document.write("<br>")
       for(let z=0;z<arr2.length;z++)
       {
            for(let c=0;c<arr2.length;c++)
            {
                document.write("&nbsp;&nbsp;&nbsp;",arr2[z][c])
            }
            document.write("<br>")
       }
       function myfunction()
       {
            document.write("This is Test")
       }
       myfunction()
       document.write("<br>")
       function withreturn()
       {
            return 25
       }
       let st=withreturn()
       document.write(st)
       document.write("<br>")
       function withargu(a,s)
       {
            let sum=a+s
            document.write(sum)
       }
       withargu(100,20)
       document.write("<br>")
       function witharguwithre(g,h)
       {
            return g*h
       }
       let str=witharguwithre(10,5)
       document.write(str)
       let str1="hello"
       document.write(str1)
       let A=20,B=40
       document.write("<br>A==",A,"B==",B)
       document.write(`<br>A==${A}B==${B}`)
</script>  
</body>
</html>
